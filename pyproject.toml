[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editorial-team"
version = "0.1.0"
description = "Infrastructure for the Editorial Team assistant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "jsonschema>=4.23",
    "langgraph>=1.2,<2.0",
    "langgraph-checkpoint>=4.1,<5.0",
    "python-telegram-bot==22.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
